<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft — photo-scanned hand, cursor follow only</title>
<style>
  html,body{margin:0;height:100%;background:#0A101E;overflow:hidden}
  #stage{position:fixed;inset:0;
    background:url('assets/img/airmouse-room.jpg') center/cover no-repeat #0A101E}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .note{position:fixed;left:20px;bottom:18px;z-index:5;
    font:400 12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.72)}
  .ctl{position:fixed;right:16px;top:16px;z-index:6;
    font:400 12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#fff;
    background:rgba(10,16,30,.72);padding:10px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,.16)}
  .ctl label{display:block;margin-bottom:6px}
  .ctl input{width:120px;vertical-align:middle}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="c"></canvas>
<p class="note">DRAFT · photo-scanned mesh, cursor-follow only (no rig, no pinch)</p>
<div class="ctl">
  <label>rot X <input type="range" id="rx" min="-180" max="180" value="-90"><span id="vx">-90</span></label>
  <label>rot Y <input type="range" id="ry" min="-180" max="180" value="0"><span id="vy">0</span></label>
  <label>rot Z <input type="range" id="rz" min="-180" max="180" value="0"><span id="vz">0</span></label>
  <label>light <input type="range" id="lt" min="0" max="200" value="55"><span id="vl">55</span></label>
</div>

<script type="module">
import * as T from './assets/vendor/three-slim.min.js';

/* The scan is one mesh with one embedded texture, so parsing the container
   directly is smaller than shipping a loader that handles every glTF feature. */
async function loadScan(url) {
  const buf = new Uint8Array(await (await fetch(url)).arrayBuffer());
  const dv = new DataView(buf.buffer);
  const jsonLen = dv.getUint32(12, true);
  const gltf = JSON.parse(new TextDecoder().decode(buf.subarray(20, 20 + jsonLen)));
  const bin = buf.subarray(20 + jsonLen + 8);

  const view = i => {
    const bv = gltf.bufferViews[i];
    const o = bv.byteOffset || 0;
    return bin.subarray(o, o + bv.byteLength);
  };
  /* The vendored bundle is tree-shaken to 30 exports, so this builds everything
     from Float32BufferAttribute + a canvas-backed texture rather than pulling
     BufferAttribute / Texture / GLTFLoader back into the build. */
  const typed = (accIdx, size, Ctor) => {
    const acc = gltf.accessors[accIdx];
    const raw = view(acc.bufferView);
    return new Ctor(raw.buffer, raw.byteOffset + (acc.byteOffset || 0), acc.count * size);
  };

  const prim = gltf.meshes[0].primitives[0];
  const geo = new T.BufferGeometry();
  geo.setAttribute('position',
    new T.Float32BufferAttribute(typed(prim.attributes.POSITION, 3, Float32Array).slice(), 3));
  if (prim.attributes.TEXCOORD_0 !== undefined) {
    geo.setAttribute('uv',
      new T.Float32BufferAttribute(typed(prim.attributes.TEXCOORD_0, 2, Float32Array).slice(), 2));
  }
  geo.setIndex(Array.from(typed(prim.indices, 1, Uint32Array)));
  geo.computeVertexNormals();          // the scan ships none, so it flat-shades without this
  geo.computeBoundingBox();

  const img = gltf.images[0];
  const blob = new Blob([view(img.bufferView)], { type: img.mimeType });
  const bitmap = await createImageBitmap(blob);
  const cv = document.createElement('canvas');
  cv.width = bitmap.width; cv.height = bitmap.height;
  cv.getContext('2d').drawImage(bitmap, 0, 0);
  const tex = new T.CanvasTexture(cv);
  tex.colorSpace = T.SRGBColorSpace;
  tex.flipY = false;                   // glTF UVs already have origin at top-left
  tex.needsUpdate = true;

  return { geo, tex };
}

const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = T.SRGBColorSpace;

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 3.4);

/* The scan's texture already contains the studio lighting it was photographed
   under. Relighting it hard fights that and reads as putty, so the rig here is
   deliberately soft: broad fill carries the form, one gentle key adds shape. */
const hemi = new T.HemisphereLight(0xdfeaff, 0x2a3550, 1.15);
scene.add(hemi);
const key = new T.DirectionalLight(0xffffff, 0.55);
key.position.set(-2.2, 2.4, 2.6);
scene.add(key);
const rim = new T.DirectionalLight(0x8fdcff, 0.7);
rim.position.set(-3, 0.6, -1.8);
scene.add(rim);

const wrap = new T.Group();
scene.add(wrap);
const spin = new T.Group();
wrap.add(spin);

const { geo, tex } = await loadScan('assets/models/hand-scan.glb');
const mat = new T.MeshPhysicalMaterial({ map: tex, roughness: 0.72, metalness: 0.0, clearcoat: 0.05, clearcoatRoughness: 0.7 });
const mesh = new T.Mesh(geo, mat);
spin.add(mesh);

// centre the mesh on its own bounding box so rotation pivots through the hand
const bb = geo.boundingBox;
mesh.position.set(
  -(bb.min.x + bb.max.x) / 2,
  -(bb.min.y + bb.max.y) / 2,
  -(bb.min.z + bb.max.z) / 2
);
const size = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);
spin.scale.setScalar(1.9 / size);

const deg = d => d * Math.PI / 180;
const base = { x: -90, y: 0, z: 0 };
const applyBase = () => spin.rotation.set(deg(base.x), deg(base.y), deg(base.z));
applyBase();

for (const [id, k] of [['rx', 'x'], ['ry', 'y'], ['rz', 'z']]) {
  const el = document.getElementById(id);
  const out = document.getElementById('v' + k);
  el.addEventListener('input', () => { base[k] = +el.value; out.textContent = el.value; applyBase(); });
}
document.getElementById('lt').addEventListener('input', e => {
  hemi.intensity = +e.target.value / 48;
  document.getElementById('vl').textContent = e.target.value;
});

// cursor follow: the whole hand turns toward the pointer with spring lag
let tx = 0, ty = 0, cx = 0, cy = 0, vx = 0, vy = 0;
addEventListener('mousemove', e => {
  tx = (e.clientY / innerHeight - 0.5) * -0.45;
  ty = (e.clientX / innerWidth - 0.5) * 0.85;
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(t => {
  vx += (tx - cx) * 0.06; vx *= 0.86; cx += vx;
  vy += (ty - cy) * 0.06; vy *= 0.86; cy += vy;
  wrap.rotation.x = cx;
  wrap.rotation.y = cy;
  wrap.position.y = Math.sin(t / 1400) * 0.03;   // slow drift so it never looks frozen
  renderer.render(scene, camera);
});
</script>
</body>
</html>
