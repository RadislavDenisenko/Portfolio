name: Fetch generated asset
on:
  workflow_dispatch:
    inputs:
      url:
        description: Source URL to download
        required: true
      path:
        description: Repo path to save the file to
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/portfolio-website-design-gtyyvt
      - name: Download
        run: |
          mkdir -p "$(dirname "${{ inputs.path }}")"
          curl -fsSL -o "${{ inputs.path }}" "${{ inputs.url }}"
          ls -la "${{ inputs.path }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/portfolio-website-design-gtyyvt || true
          git add "${{ inputs.path }}"
          git commit -m "Add generated asset: ${{ inputs.path }}"
          git push
